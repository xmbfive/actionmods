<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing Page</title>
<style>
    /* Reset & base styles */
    * {margin:0; padding:0; box-sizing:border-box; font-family: 'Poppins', sans-serif;}
    body, html {
        height:100%;
        overflow:hidden;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        position:relative;
        color:white;
    }

    /* Animated background circles */
    .circle {
        position:absolute;
        border-radius:50%;
        opacity:0.15;
        animation: float 20s linear infinite;
    }
    .circle:nth-child(1) {width:200px;height:200px; background:#ff6b6b; top:10%; left:15%; animation-duration:25s;}
    .circle:nth-child(2) {width:300px;height:300px; background:#feca57; top:70%; left:70%; animation-duration:30s;}
    .circle:nth-child(3) {width:150px;height:150px; background:#48dbfb; top:40%; left:50%; animation-duration:22s;}
    .circle:nth-child(4) {width:250px;height:250px; background:#1dd1a1; top:20%; left:80%; animation-duration:28s;}

    @keyframes float {
        0% {transform: translateY(0) translateX(0);}
        50% {transform: translateY(-50px) translateX(50px);}
        100% {transform: translateY(0) translateX(0);}
    }

    /* Logo styling */
    .logo {
        width:150px;
        height:150px;
        background:url('logo.png') no-repeat center/contain;
        margin-bottom:40px;
        animation: logoBounce 2s ease-in-out infinite;
    }
    @keyframes logoBounce {
        0%,100% {transform: translateY(0);}
        50% {transform: translateY(-20px);}
    }

    /* Button styling */
    .access-btn {
        padding:15px 40px;
        font-size:18px;
        font-weight:bold;
        color:#fff;
        background:linear-gradient(45deg,#ff6b6b,#feca57,#48dbfb,#1dd1a1);
        background-size:300% 300%;
        border:none;
        border-radius:50px;
        cursor:pointer;
        animation: gradientAnim 5s ease infinite;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .access-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    @keyframes gradientAnim {
        0%{background-position:0% 50%;}
        50%{background-position:100% 50%;}
        100%{background-position:0% 50%;}
    }

    /* Mobile responsive */
    @media(max-width:480px){
        .logo {width:120px; height:120px; margin-bottom:30px;}
        .access-btn {padding:12px 30px; font-size:16px;}
    }
</style>
</head>
<body>
    <!-- Animated circles -->
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>

    <!-- Logo -->
    <div class="logo"></div>

    <!-- Access button -->
    <a href="https://t.me/sohamgameplay" target="_blank">
        <button class="access-btn">Access Content</button>
    </a>

</body>
</html>
